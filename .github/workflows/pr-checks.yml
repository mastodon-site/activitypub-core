name: PR Checks
on:
  - pull_request
jobs:
  check_semver_label:
    name: Check for semantic version label
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          one_of: major,minor,patch
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  go-tests:
    name: Go Tests and Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: activitypub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d activitypub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      AP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/activitypub_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache
            ${{ github.workspace }}/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

      - name: Build all packages
        run: go build ./...

  docker-build-test:
    name: Test Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [apd, apw]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: activitypub-core-${{ matrix.target }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          echo "Verifying Docker image was built successfully..."
          docker run --rm --entrypoint /bin/sh activitypub-core-${{ matrix.target }}:test -c "test -x /app/${{ matrix.target }}"
          echo "Docker build and verification passed!"
